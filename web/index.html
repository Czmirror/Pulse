<!DOCTYPE html>
<!-- Pulseの表示領域とWASMの起動処理。 -->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pulse</title>
  <style>
    :root {
      --stage: #040510;
      --surround: #101333;
      --edge: #272d5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, var(--surround), var(--stage) 75%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }
    #game-stage {
      width: min(100vw, 100dvh, 520px);
      height: min(100dvh, 217vw, 840px);
      background: var(--stage);
      outline: 1px solid var(--edge);
    }
    canvas#bevy-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #error-panel {
      display: none;
      width: min(92vw, 560px);
      padding: 20px;
      border: 1px solid #3a4768;
      border-radius: 12px;
      background: rgba(10, 14, 26, 0.96);
      color: #eef3ff;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    }
    body.error #game-stage { display: none; }
    body.error #error-panel { display: block; }
    #error-panel strong { display: block; margin-bottom: 8px; font-size: 18px; }
    #error-panel button {
      margin-top: 16px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid #72e8fa;
      border-radius: 8px;
      background: #10293d;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main id="game-stage" aria-label="Pulse">
    <canvas id="bevy-canvas"></canvas>
  </main>
  <div id="error-panel" lang="en">
    <div role="alert">
      <strong>Pulse could not start.</strong>
      <p id="error-message"></p>
    </div>
    <button type="button" id="retry-startup">Reload game</button>
  </div>
  <script type="module">
    const errorMessage = document.getElementById("error-message");
    const retryButton = document.getElementById("retry-startup");
    retryButton.addEventListener("click", () => window.location.reload());

    function showError(message) {
      document.body.classList.add("error");
      errorMessage.textContent = message;
      retryButton.focus();
    }

    async function startGame() {
      const canvas = document.createElement("canvas");
      if (!("gpu" in navigator) && !canvas.getContext("webgl2")) {
        showError("This browser does not support WebGL2 or WebGPU. Try opening Pulse in an up-to-date browser.");
        return;
      }

      const { default: init } = await import("./pulse.js");
      await init();
    }

    startGame().catch((error) => {
      // winitはブラウザのイベントループに制御を渡す際にこの例外を投げる。
      if (error?.message === "Using exceptions for control flow, don't mind me. This isn't actually an error!") {
        return;
      }

      console.error(error);
      showError("The game failed to load. Check your connection and reload the game.");
    });
  </script>
</body>
</html>
